name: 🚀 Auto Deploy to VPS (Staging & Production)

on:
  push:
    branches:
      - development
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Determine Environment Target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "app_dir=/var/www/gamingstore" >> $GITHUB_OUTPUT
            echo "pm2_name=gamingstore" >> $GITHUB_OUTPUT
            echo "port=3000" >> $GITHUB_OUTPUT
            echo "mem_limit=1024" >> $GITHUB_OUTPUT
          else
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "app_dir=/var/www/gamingstore-staging" >> $GITHUB_OUTPUT
            echo "pm2_name=gamingstore-staging" >> $GITHUB_OUTPUT
            echo "port=3001" >> $GITHUB_OUTPUT
            echo "mem_limit=768" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Execute Remote Deployment via Direct SSH
        env:
          SSH_KEY_SECRET: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          APP_DIR: ${{ steps.target.outputs.app_dir }}
          ENV_NAME: ${{ steps.target.outputs.env_name }}
          PM2_NAME: ${{ steps.target.outputs.pm2_name }}
          APP_PORT: ${{ steps.target.outputs.port }}
          MEM_LIMIT: ${{ steps.target.outputs.mem_limit }}
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh

          # Deteksi apakah secret berupa Base64 atau Raw Text PEM
          if echo "$SSH_KEY_SECRET" | grep -q "BEGIN"; then
            printf "%s\n" "$SSH_KEY_SECRET" > ~/.ssh/deploy_key
          else
            echo "$SSH_KEY_SECRET" | base64 -d > ~/.ssh/deploy_key
          fi

          # Pastikan file berakhir dengan newline dan permission ketat
          sed -i -e '$a\' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "📡 Menghubungkan ke $SSH_USER@$SSH_HOST:$SSH_PORT..."

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "bash -s" << EOF
            set -e

            echo "=========================================="
            echo "📦 Deploying to: $ENV_NAME"
            echo "📁 Target Directory: $APP_DIR"
            echo "=========================================="

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # 1. Tarik perubahan code terbaru
            echo "🔄 Pulling latest code from branch $BRANCH..."
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            # 2. Install dependencies yang bersih
            echo "📥 Installing dependencies..."
            npm ci

            # 3. Build standalone application
            echo "🏗️ Building Next.js application..."
            npm run build

            # 4. Salin asset statis (Wajib untuk Standalone Mode)
            echo "📂 Copying public and static assets..."
            cp -r public .next/standalone/
            cp -r .next/static .next/standalone/.next/

            # 5. Reload atau Start PM2 dengan Zero-Downtime
            echo "⚡ Reloading PM2 process ($PM2_NAME)..."
            if pm2 describe "$PM2_NAME" > /dev/null 2>&1; then
              pm2 reload "$PM2_NAME" --update-env
            else
              cd "$APP_DIR/.next/standalone"
              PORT="$APP_PORT" pm2 start server.js --name "$PM2_NAME" --node-args="--max-old-space-size=$MEM_LIMIT"
              pm2 save
            fi

            echo "=========================================="
            echo "✅ Deployment $ENV_NAME Sukses & Aktif!"
            echo "=========================================="
            pm2 status
          EOF
